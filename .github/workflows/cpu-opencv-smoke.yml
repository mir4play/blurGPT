name: CPU + OpenCV Runtime Smoke

on:
  pull_request:
    paths:
      - ".github/workflows/cpu-opencv-smoke.yml"
      - "scripts/smoke_cpu_opencv.py"
      - "core/**"
      - "models/blurGPT.pt"
      - "requirements.txt"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/cpu-opencv-smoke.yml"
      - "scripts/smoke_cpu_opencv.py"
      - "core/**"
      - "models/blurGPT.pt"
      - "requirements.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-opencv-runtime:
    name: Windows CPU inference + OpenCV mp4v
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      ULTRALYTICS_VERBOSE: "False"
    steps:
      - name: Check out repository and model
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install CPU-only PyTorch
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Install inference and video dependencies
        run: |
          python -m pip install "ultralytics==8.4.104" "opencv-python==5.0.0.93" "tqdm==4.69.0"

      - name: Run real CPU + OpenCV batch smoke test
        run: python scripts/smoke_cpu_opencv.py
